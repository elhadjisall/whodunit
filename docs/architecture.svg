<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-label="Whodunit architecture">
  <rect width="980" height="420" fill="#0b0b0d"/>
  <text x="28" y="36" fill="#ebdcb9" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2">WHODUNIT · CASE PIPELINE</text>

  <!-- boxes -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="28" y="64" width="170" height="112" rx="8" fill="#15161a" stroke="#c9b27e"/>
    <text x="113" y="98" text-anchor="middle" fill="#ebdcb9" font-size="14" font-weight="700">Complaint</text>
    <text x="113" y="122" text-anchor="middle" fill="#a89b7a" font-size="11">one sentence</text>
    <text x="113" y="140" text-anchor="middle" fill="#a89b7a" font-size="11">108 commits</text>
    <text x="113" y="158" text-anchor="middle" fill="#a89b7a" font-size="11">git worktrees</text>

    <rect x="246" y="64" width="210" height="112" rx="8" fill="#15161a" stroke="#00b84a"/>
    <text x="351" y="94" text-anchor="middle" fill="#00ff66" font-size="14" font-weight="700">Elasticsearch 9</text>
    <text x="351" y="116" text-anchor="middle" fill="#8fd9a8" font-size="11">wd-commits · wd-hunks</text>
    <text x="351" y="134" text-anchor="middle" fill="#8fd9a8" font-size="11">wd-logs · wd-issues</text>
    <text x="351" y="154" text-anchor="middle" fill="#8fd9a8" font-size="11">BM25 + kNN 768d + RRF</text>

    <rect x="504" y="64" width="210" height="112" rx="8" fill="#15161a" stroke="#f4b942"/>
    <text x="609" y="94" text-anchor="middle" fill="#f4b942" font-size="14" font-weight="700">Gemini</text>
    <text x="609" y="116" text-anchor="middle" fill="#d4c08a" font-size="11">investigate · reproduce · fix</text>
    <text x="609" y="134" text-anchor="middle" fill="#d4c08a" font-size="11">tool calling · embeddings</text>
    <text x="609" y="154" text-anchor="middle" fill="#d4c08a" font-size="11">quota fallback</text>

    <rect x="762" y="64" width="190" height="112" rx="8" fill="#15161a" stroke="#e63946"/>
    <text x="857" y="98" text-anchor="middle" fill="#e63946" font-size="14" font-weight="700">Bayesian bisect</text>
    <text x="857" y="122" text-anchor="middle" fill="#e8a0a6" font-size="11">weighted median</text>
    <text x="857" y="140" text-anchor="middle" fill="#e8a0a6" font-size="11">µ-noise / flakes</text>
    <text x="857" y="158" text-anchor="middle" fill="#e8a0a6" font-size="11">bracket the culprit</text>
  </g>

  <!-- arrows row 1 -->
  <g stroke="#ebdcb9" stroke-width="2" fill="#ebdcb9">
    <line x1="198" y1="120" x2="238" y2="120"/>
    <polygon points="238,114 250,120 238,126"/>
    <line x1="456" y1="120" x2="496" y2="120"/>
    <polygon points="496,114 508,120 496,126"/>
    <line x1="714" y1="120" x2="754" y2="120"/>
    <polygon points="754,114 766,120 754,126"/>
  </g>

  <!-- bottom: UI -->
  <rect x="28" y="220" width="924" height="168" rx="8" fill="#15161a" stroke="#ebdcb9"/>
  <text x="48" y="252" fill="#ebdcb9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">Interrogation Room (React)</text>
  <text x="48" y="276" fill="#a89b7a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">SSE event stream from the Node play server. Simulated run if Elasticsearch or Gemini is down.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle">
    <rect x="48" y="300" width="200" height="60" rx="6" fill="#1d1f24" stroke="#c9b27e"/>
    <text x="148" y="326" fill="#ebdcb9">Complaint desk</text>
    <text x="148" y="344" fill="#a89b7a">simulated vs live</text>

    <rect x="268" y="300" width="200" height="60" rx="6" fill="#1d1f24" stroke="#c9b27e"/>
    <text x="368" y="326" fill="#ebdcb9">Cork board</text>
    <text x="368" y="344" fill="#a89b7a">posterior heat</text>

    <rect x="488" y="300" width="200" height="60" rx="6" fill="#1d1f24" stroke="#00b84a"/>
    <text x="588" y="326" fill="#00ff66">ES radar</text>
    <text x="588" y="344" fill="#8fd9a8">ES|QL · hybrid</text>

    <rect x="708" y="300" width="220" height="60" rx="6" fill="#1d1f24" stroke="#e63946"/>
    <text x="818" y="326" fill="#e63946">Daily Commit</text>
    <text x="818" y="344" fill="#e8a0a6">cited verdict · fix</text>
  </g>

  <line x1="490" y1="176" x2="490" y2="220" stroke="#ebdcb9" stroke-width="2"/>
  <polygon points="484,220 490,232 496,220" fill="#ebdcb9"/>
</svg>
